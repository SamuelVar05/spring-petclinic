
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:9.7}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD:-true}"
      MYSQL_USER: "${DB_USER:-petclinic}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-petclinic}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-petclinic}"
    volumes:
      - mysql-data:/var/lib/mysql
      - "./conf.d:/etc/mysql/conf.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  petclinic:
    image: ${PETCLINIC_IMAGE:-us-west1-docker.pkg.dev/entorno-elasticidad/petclinic-repo/spring-petclinic:baseline}
    ports:
      - "${PETCLINIC_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      MYSQL_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${MYSQL_DATABASE:-petclinic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${DB_USER:-petclinic}
      MYSQL_PASS: ${DB_PASSWORD:-petclinic}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
